services:
  - type: web
    name: phk-stem-lab
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:pg && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phk-stem-lab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: FAST_MODEL
        value: gemini-2.5-flash
      - key: REASONING_MODEL
        value: gemini-2.5-pro
      - key: STORAGE_PROVIDER
        value: filesystem
      - key: STORAGE_ROOT
        value: /var/data/uploads
      - key: MAX_PDF_SIZE
        value: "52428800"
      - key: MAX_AI_INPUT_SIZE
        value: "47185920"
    disk:
      name: phk-stem-lab-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: phk-stem-lab-db
    databaseName: phk_stem_lab
    user: phk_stem_lab
